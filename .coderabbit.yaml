# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: zh-CN
tone_instructions: >-
  优先检查真实的正确性、安全边界、并发一致性、数据库迁移和部署风险。
  发现问题时说明具体文件、触发条件及修复方向；避免格式争论、推测性重构
  和重复已有 CI 结果。

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  commit_status: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: "apps/edge/**"
      instructions: >-
        检查 Cloudflare Access 身份验证、可信请求头、回源密钥以及 Web/MCP
        主机和路径隔离，避免未认证访问与身份伪造。
    - path: "apps/api/**"
      instructions: >-
        检查工作区访问控制、事务原子性、并发更新、任务归档与历史清理语义，
        以及 PostgreSQL 迁移的兼容性和数据保全。
    - path: "apps/mcp/**"
      instructions: >-
        检查 Agent Key 的逐请求认证、撤销生效、并发请求身份隔离，
        以及 MCP 到业务 API 的认证传递。
    - path: ".github/workflows/**"
      instructions: >-
        检查 dev/main 分支门禁、发布与部署权限边界，以及 CI 检查是否被绕过。
