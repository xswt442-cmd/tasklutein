name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  github-release:
    name: Verify tagged source and publish notes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Verify tag, branch ancestry, and bilingual release note
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          test "$RELEASE_TAG" = "v$version" || { echo "Tag must match package.json version"; exit 1; }
          test -f ".github/release-notes/$RELEASE_TAG.md" || { echo "Missing release notes"; exit 1; }
          grep -Fq '### 简体中文' ".github/release-notes/$RELEASE_TAG.md"
          grep -Fq '### English' ".github/release-notes/$RELEASE_TAG.md"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to an ancestor of main"
            exit 1
          }
      - run: npm ci
      - name: Verify Worker and MCP
        run: npm run check
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify FastAPI
        run: |
          python -m pytest -q
          ruff check backend/app backend/tests
      - name: Publish GitHub Release (no infrastructure deployment)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to rewrite an existing release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Tasklutein $RELEASE_TAG" \
            --notes-file ".github/release-notes/$RELEASE_TAG.md" \
            --repo "$GITHUB_REPOSITORY"
          echo "GitHub Release published; Cloudflare and Tencent deployments remain manual."
