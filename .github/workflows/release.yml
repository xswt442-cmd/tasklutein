name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  github-release:
    name: Verify tagged source and publish notes
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify tag, branch ancestry, and bilingual changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          test "$RELEASE_TAG" = "v$version" || { echo "Tag must match package.json version"; exit 1; }
          node scripts/release-notes.mjs --changelog CHANGELOG.md --tag "$RELEASE_TAG" --manifest package.json > "$RUNNER_TEMP/release-notes.md"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to an ancestor of main"
            exit 1
          }
      - name: Publish GitHub Release (no infrastructure deployment)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to rewrite an existing release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Tasklutein $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --repo "$GITHUB_REPOSITORY"
          echo "GitHub Release published; Cloudflare and Tencent deployments remain manual."
